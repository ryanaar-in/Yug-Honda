<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bikes & Scooters - Yug Honda</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#f5f5f6}
:root{--red:#E4002B}
.header{background:#12171e;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 4%;position:sticky;top:0;z-index:99;gap:20px}
.logo{font-family:'Outfit';font-weight:800;font-size:20px;letter-spacing:1px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.logo span{font-family:'Inter';font-weight:400;font-size:11px;color:#888}
.desktop-nav{display:flex;align-items:center;gap:24px}
.header a{color:#9aa0a8;text-decoration:none;font-size:13px;white-space:nowrap;transition:0.2s}
.header a:hover{color:#fff}
.header a.active{color:#fff;border-bottom:2px solid var(--red);padding-bottom:4px}
.container{padding:20px 4%}
.filter{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.filter button{padding:8px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
.filter button.active{background:#12171e;color:#fff;border-color:#12171e}
.models{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border-radius:12px;padding:14px;text-align:center;border:1px solid #eee;transition:0.2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,0.08)}
.card img{width:100%;height:140px;object-fit:contain;background:#f9fafb;border-radius:8px;padding:8px}
.card h4{font-size:14px;margin-top:10px}.card p{font-size:11px;color:#666}
.price{font-size:12px;margin-top:6px;color:#111}
.view{border:1px solid #111;padding:6px 14px;border-radius:20px;font-size:11px;background:#fff;margin-top:10px;cursor:pointer}
.view:hover{background:#111;color:#fff}
/* RIBBON FIX - BAS SALE */
.diag-ribbon{position:absolute;top:18px;left:-32px;width:110px;text-align:center;background:var(--red);color:#fff;padding:6px 0;transform:rotate(-45deg);font-size:10px;font-weight:800;z-index:5;box-shadow:0 3px 10px rgba(0,0,0,0.3);letter-spacing:0.5px;line-height:1.1}
.hamburger{display:none;font-size:22px;cursor:pointer;background:none;border:none;color:#fff}
.mobile-menu{display:none;flex-direction:column;background:#12171e;padding:14px 4%;gap:12px;position:sticky;top:56px;z-index:98}
.mobile-menu a{color:#9aa0a8;text-decoration:none;font-size:13px;padding:10px 0;border-bottom:1px solid #222}
@media(max-width:1050px){.desktop-nav{gap:16px}.header a{font-size:12px}.logo{font-size:18px}}
@media(max-width:900px){.models{grid-template-columns:1fr 1fr}}
@media(max-width:850px){.desktop-nav{display:none}.hamburger{display:block}}
</style>
</head>
<body>
<div class="header">
<div class="logo">YUG HONDA <span id="showroomMini">Pusa</span></div>
<div style="display:flex;align-items:center">
<div class="desktop-nav">
<a href="index.html">Home</a>
<a class="active" href="bikes.html">Bikes & Scooters</a>
<a href="offers.html">Offers</a>
<a href="gallery.html">Gallery</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</div>
<button class="hamburger" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
</div>
</div>
<div id="mobileMenu" class="mobile-menu">
<a href="index.html">Home</a>
<a href="bikes.html">Bikes & Scooters</a>
<a href="offers.html">Offers</a>
<a href="gallery.html">Gallery</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</div>

<div class="container">
<h1 style="font-family:'Outfit';font-size:28px">Bikes & Scooters</h1>
<p style="font-size:12px;color:#666;margin-top:4px" id="totalCount">Loading from Firebase...</p>

<div class="filter" style="margin-top:16px">
<button class="active" onclick="filterBikes('All',this)">All</button>
<button onclick="filterBikes('Commuter Bike',this)">Commuter Bike</button>
<button onclick="filterBikes('Scooter',this)">Scooter</button>
<button onclick="filterBikes('Premium Bike',this)">Premium Bike</button>
<button onclick="filterBikes('Sports Bike',this)">Sports Bike</button>
</div>

<div class="models" id="modelsContainer"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAufUEH0vcrBwYxi7Q42n4_NABGiAesgT4",
  authDomain: "yug-honda.firebaseapp.com",
  projectId: "yug-honda",
  storageBucket: "yug-honda.firebasestorage.app",
  messagingSenderId: "7480589189",
  appId: "1:7480589189:web:d4c717eb42a49a26f6e2ec"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allBikes = [];
let perBikeOffers = {};
let currentFilter='All';

async function fetchBikes(){
  try{
    const snap = await getDocs(collection(db, "bikes"));
    allBikes = snap.docs.map(d=>({id:d.id,...d.data()})).filter(b=>b.stock!==false);

    const offersSnap = await getDoc(doc(db, "offers", "main"));
    if(offersSnap.exists()) perBikeOffers = offersSnap.data().perBikeOffers || {};
    else perBikeOffers = JSON.parse(localStorage.getItem('yug_per_bike_offers')||'{}');

    const settingsSnap = await getDoc(doc(db, "settings", "main"));
    if(settingsSnap.exists()){
      let s = settingsSnap.data();
      if(s.name) document.getElementById('showroomMini').innerText=s.name+' - Pusa';
    }

    renderBikes();
  }catch(e){
    console.error(e);
    document.getElementById('totalCount').innerText='Failed to load. Check Firebase config.';
  }
}

window.renderBikes = function(){
  let filtered = currentFilter==='All'? allBikes : allBikes.filter(b=>b.cat===currentFilter);
  document.getElementById('totalCount').innerText=filtered.length+' models found - '+currentFilter;
  let container=document.getElementById('modelsContainer');
  if(filtered.length===0){
    container.innerHTML='<p style="color:#999;padding:40px;text-align:center">No bikes in this category. Add from Admin Panel.</p>'; return;
  }
  container.innerHTML=filtered.map((b)=>{
    let trueIdx=allBikes.findIndex(x=>x.id===b.id);
    let price=b.price || b.specs?.find(s=>s.k==='price')?.v || '0';
    let offer=perBikeOffers[b.name]||'';
    let firstImg=b.imgs && b.imgs[0]? b.imgs[0] : '';
    let desc=b.desc? b.desc.substring(0,70)+'...' : '';
    return `<div class="card">
      ${offer?`<div class="diag-ribbon" title="${offer}">SALE</div>`:''}
      <img src="${firstImg}" onerror="this.src='https://via.placeholder.com/200'">
      <h4>${b.name}</h4>
      <p>${b.cat||''}</p>
      <p style="font-size:10px;color:#888;margin-top:4px">${desc}</p>
      <div class="price">Starting at <b>₹ ${Number(price).toLocaleString('en-IN')||price}*</b></div>
      <button class="view" onclick="openDetail(${trueIdx})">View Details →</button>
      <button class="view" style="background:#E4002B;color:#fff;border-color:#E4002B;margin-left:4px" onclick="bookRide('${b.name}')">Book Ride</button>
    </div>`
  }).join('');
}

window.filterBikes = function(cat,btn){
  currentFilter=cat;
  document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderBikes();
}

window.openDetail = function(i){
  let bike = allBikes[i];
  localStorage.setItem('yug_view_bike_id', bike.id);
  localStorage.setItem('yug_view_bike', i);
  window.open('bike-detail.html?id='+bike.id,'_blank');
}

window.bookRide = function(name){
  window.location.href='book-ride.html?bike='+encodeURIComponent(name);
}

fetchBikes();
document.getElementById('hamburgerBtn').onclick = () => {
  let m=document.getElementById('mobileMenu');
  m.style.display = m.style.display==='flex'? 'none' : 'flex';
}
</script>
</body>
</html>
