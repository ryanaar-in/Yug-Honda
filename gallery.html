<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Yug Honda</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#f5f5f6}
:root{--red:#E4002B}
.header{background:#12171e;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 4%;position:sticky;top:0;z-index:99}
.header a{color:#9aa0a8;text-decoration:none;font-size:13px;margin-left:18px}
.header a.active{color:#fff}
.hero{background:#12171e;color:#fff;padding:36px 4%;text-align:center}
.hero h1{font-family:'Outfit';font-size:34px}
.hero p{font-size:12px;opacity:0.6;margin-top:6px}
.tabs{display:flex;gap:8px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
.tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.gallery{max-width:1200px;margin:0 auto;padding:0 4% 30px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.gallery{grid-template-columns:1fr}}
.item{position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #eee;cursor:pointer;aspect-ratio:4/3}
.item img,.item video{width:100%;height:100%;object-fit:cover;transition:0.3s}
.item:hover img{transform:scale(1.06)}
.item .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.3)}
.item .play i{width:44px;height:44px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--red)}
.item .tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);color:#fff;font-size:9px;padding:3px 8px;border-radius:10px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
.lightbox.active{display:flex}
.lightbox img,.lightbox video{max-width:90vw;max-height:85vh;border-radius:10px}
.lightbox .close{position:absolute;top:18px;right:20px;color:#fff;font-size:26px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;background:#fff;border-radius:12px;border:1px dashed #ddd}
</style>
</head>
<body>
<div class="header"><div><b id="headerName">YUG HONDA</b></div><div><a href="index.html">Home</a><a href="bikes.html">Bikes</a><a class="active" href="gallery.html">Gallery</a><a href="contact.html">Contact</a></div></div>

<div class="hero">
<h1>Our Gallery</h1>
<p id="heroSub">Showroom, Bikes & Happy Customers - LIVE from Firebase</p>
</div>

<div class="tabs">
<button class="tab active" onclick="filterGallery('all',this)">All</button>
<button class="tab" onclick="filterGallery('image',this)">Images</button>
<button class="tab" onclick="filterGallery('video',this)">Videos</button>
</div>

<div class="gallery" id="galleryGrid"><p style="grid-column:1/-1;text-align:center;color:#888;font-size:12px;padding:20px">Loading from Firebase...</p></div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
<span class="close"><i class="fa-solid fa-xmark"></i></span>
<img id="lbImg" style="display:none">
<video id="lbVideo" controls style="display:none"></video>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAufUEH0vcrBwYxi7Q42n4_NABGiAesgT4",
  authDomain: "yug-honda.firebaseapp.com",
  projectId: "yug-honda",
  storageBucket: "yug-honda.firebasestorage.app",
  messagingSenderId: "7480589189",
  appId: "1:7480589189:web:d4c717eb42a49a26f6e2ec"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allItems = [];
let currentFilter='all';

async function loadGallery(){
  try{
    let items = [];
    // Try new collection gallery (with type field)
    const snap = await getDocs(collection(db, "gallery"));
    snap.docs.forEach(d=>{
      let data = d.data();
      if(data.src || data.url){
        items.push({
          src: data.src || data.url,
          type: data.type || (data.src?.includes('.mp4') || data.url?.includes('.mp4') ? 'video' : 'image'),
          cat: data.type || 'image'
        });
      }
    });

    // Fallback old keys yug_gallery
    if(items.length===0){
      let images = JSON.parse(localStorage.getItem('yug_gallery')||'[]');
      let videos = JSON.parse(localStorage.getItem('yug_gallery_videos')||'[]');
      images.forEach(src=>{ if(src) items.push({src,type:'image',cat:'image'}); });
      videos.forEach(src=>{ if(src) items.push({src,type:'video',cat:'video'}); });
    }

    allItems = items;

    // settings
    try{
      const sSnap = await getDoc(doc(db, "settings", "main"));
      if(sSnap.exists() && sSnap.data().name){
        document.getElementById('headerName').innerText=sSnap.data().name.toUpperCase();
      }
    }catch(e){}

    renderGallery();
  }catch(e){
    console.error(e);
    document.getElementById('galleryGrid').innerHTML='<p style="color:red">'+e.message+'</p>';
  }
}

window.renderGallery = function(){
  let grid=document.getElementById('galleryGrid');
  let filtered = allItems.filter(i=>{
    if(currentFilter==='all') return true;
    return i.type===currentFilter;
  });

  if(filtered.length===0){
    grid.innerHTML=`
      <div class="empty">
        <i class="fa-regular fa-images" style="font-size:40px;color:#ccc;margin-bottom:12px;display:block"></i>
        <b style="font-size:14px">No ${currentFilter} yet</b>
        <p style="font-size:11px;color:#888;margin-top:6px">Admin Panel > Gallery se add karo, yahan LIVE show hoga</p>
      </div>`;
    return;
  }

  grid.innerHTML=filtered.map(it=>`
    <div class="item" onclick="openLightbox('${it.src}','${it.type}')">
      ${it.type==='image' ? `<img src="${it.src}" loading="lazy" onerror="this.src='https://via.placeholder.com/300'">` : `<video src="${it.src}" muted></video><div class="play"><i class="fa-solid fa-play"></i></div>`}
      <div class="tag">${it.type.toUpperCase()}</div>
    </div>
  `).join('');
}

window.filterGallery = function(type,el){
  currentFilter=type;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderGallery();
}
window.openLightbox = function(src,type){
  let lb=document.getElementById('lightbox');
  let img=document.getElementById('lbImg');
  let vid=document.getElementById('lbVideo');
  lb.classList.add('active');
  if(type==='video'){
    img.style.display='none'; vid.style.display='block'; vid.src=src; vid.play();
  }else{
    vid.style.display='none'; vid.pause(); img.style.display='block'; img.src=src;
  }
}
window.closeLightbox = function(){
  document.getElementById('lightbox').classList.remove('active');
  document.getElementById('lbVideo').pause();
}

loadGallery();
</script>
</body>
</html>
